# Geography for the /places/ destination tree (Country → City → Neighborhood).
#
# The vault is the preferred source: a destination note whose `loc` names a
# country (Vienna → [[Austria]]) tells _plugins/places.rb everything it needs,
# and publishing one from Obsidian upgrades every venue in that city with no
# change here. This file is the stopgap for destinations that have no note —
# most venues are filed straight under a bare city ([[Kyoto]], [[Paris]]) with
# no ancestry at all, so without it they'd have nowhere to hang.
#
# A city missing from `countries` still lists and still pins; it just groups
# under "Elsewhere", and the build logs a warning naming it. Adding the line
# here (or publishing its destination note) is the fix.
#
# Keys are matched case-insensitively, and the spelling used here is the
# canonical one — that's how the vault's "FiDi" and "Fidi" collapse into one
# chip instead of two.

# City → country. The country tier of the filter.
#
# Trips (/travels/) resolve through this too, so a destination I've written up
# but have no places in yet still belongs to a country — without the entry it
# hangs under "Elsewhere" instead of filtering with the rest of that country.
countries:
  New York City: United States
  Providence: United States
  Newport: United States
  New Orleans: United States
  San Diego: United States
  San Francisco: United States
  Sonoma: United States
  Upstate: United States
  Farm Coast: United States
  San Diego: United States
  Vienna: Austria
  Salzburg: Austria
  Warsaw: Poland
  Paris: France
  London: United Kingdom
  Amsterdam: Netherlands
  Humlebæk: Denmark
  Røros: Norway
  Milan: Italy
  # The lake is the destination you'd name; Tremezzo, the town the hotel is
  # in, is a neighborhood of it below.
  Lake Como: Italy
  # A region rather than a city, but it's what you'd say you're going to for
  # a winery — same reason Farm Coast and Upstate are cities here.
  Piedmont: Italy
  Mexico City: Mexico
  Marrakech: Morocco
  Kruger National Park: South Africa
  # The vault files the two winelands towns as one destination; keep its
  # spelling rather than inventing a split it doesn't make.
  Franschhoek + Stellenbosch: South Africa
  Newfoundland: Canada
  Kyoto: Japan
  Naoshima: Japan
  Mexico City: Mexico

# Neighborhood → city. Only needed for neighborhoods with no destination note;
# a note's own `loc` (Cobble Hill → [[New York City]]) takes precedence.
# This is also what stops a neighborhood from being mistaken for a city when a
# venue's `loc` chain is written outside-in ([[New York City]], [[Greenpoint]]).
# Deliberately no borough-level entries (Brooklyn, Queens): a chain like
# [[Brooklyn]], [[Cobble Hill]] names both, and the first known neighborhood
# wins — so listing Brooklyn would file Cobble Hill venues under the borough.
# A venue filed under a bare borough gets an "Elsewhere" warning at build time,
# which is the right moment to decide what that borough should be.
neighborhoods:
  Cobble Hill: New York City
  Brooklyn Heights: New York City
  Fort Greene: New York City
  Greenpoint: New York City
  Williamsburg: New York City
  West Village: New York City
  FiDi: New York City
  Inverness: San Francisco
  # Also fixes a chain written outside-in ([[Milan]], [[Lake Como]],
  # [[Tremezzo]]): with Tremezzo known as a neighborhood, identity beats
  # position and the venue lands on Lake Como instead of taking Milan — the
  # city it was flown into — as a neighborhood of Tremezzo.
  Tremezzo: Lake Como

# Country → continent. Not rendered today — the country row is 13 chips and a
# continent tier above it would be noise. Kept because the tree in places.rb is
# generic, so adding the tier later is a template change, not a data migration.
continents:
  United States: North America
  Canada: North America
  Mexico: North America
  Austria: Europe
  Italy: Europe
  Poland: Europe
  France: Europe
  United Kingdom: Europe
  Netherlands: Europe
  Denmark: Europe
  Norway: Europe
  Japan: Asia
  Morocco: Africa
  South Africa: Africa

# Destination → [lat, lng], for pinning trips (/travels/ entries) on the map.
#
# Only needed for destinations I have no places in: a trip's pin is normally
# the centroid of my own places there, which needs no maintenance and lands on
# the part of the city the trip was actually about. This is the stopgap for
# the rest — same role the sections above play for destinations with no note.
# A trip note can also carry its own `location`, which beats everything here.
#
# A destination missing from this list still gets its writeup and its places
# table; it just doesn't pin, and the build logs a warning naming it. City-
# centre precision is the point — these are trip pins, not addresses.
coords:
  Mexico City: ["19.4326", "-99.1332"]
  San Diego: ["32.7157", "-117.1611"]

# Variant → canonical, for destinations the vault names two different ways.
# Casing alone doesn't need an entry (lookups are case-insensitive); this is
# for genuinely different spellings.
aliases:
  RI Farm Coast: Farm Coast
