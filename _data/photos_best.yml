# The edit — my favourite photographs, in the order they should be read.
# Drives the /photos/ "Selects" view (the /photos/all/ Visual Diary keeps
# every frame, in date order).
#
# Why a data file and not a `favorite: true` in each photo's frontmatter:
# _photos/*.md is generated by photo_exif_generator.rb, which rewrites that
# frontmatter and would drop a hand-added field. And a curated edit is an
# *order*, not a sort — a YAML list carries the sequence for free, and
# reordering the whole set is one file to touch.
#
# Fields per entry:
#   file:     REQUIRED. Filename as it sits in assets/photos/.
#   title:    optional. Replaces the auto-generated title ("All Film 3 Of 16").
#   place:    optional. Replaces the geocoded location — worth setting where
#             Nominatim returned the local script (京都市, 日本 → Kyoto).
#   year:     optional. Overrides the EXIF year.
#
# An entry naming a file that isn't there is skipped, and the build logs a
# warning naming it.

# ⚠️ PLACEHOLDER EDIT — these are a date/place spread picked so the page
# renders, not a judgement about which frames are the good ones. Replace the
# whole list; the machinery doesn't care how long it is.

