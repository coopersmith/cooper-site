title:               Cooper Smith
description: Cooper Smith's digital garden
url: "https://coopersmith.nyc"  # Your production URL
author:
  name: Cooper Smith

# Typeface — single source of truth for the font. Drives the Google Fonts
# load (_includes/head.html), the --font-sans token (styles.scss), and the
# colophon label, so they can never drift apart.
font:
  name: Hanken Grotesk
  weights: "400;500;600;700"
  specimen: https://fonts.google.com/specimen/Hanken+Grotesk

# CARTO basemap tiles — the /places/ map and the destination/trip mini-maps
# (assets/js/places-map.js). CARTO's raster endpoint stopped being anonymous
# in 2026: requests without a key come back stamped "API KEY REQUIRED".
# Free within their fair-use limit (5M tiles/month). Public by nature — it
# travels in every tile URL the browser requests — so it lives here rather
# than in the build environment. Leave blank and the maps still render,
# just watermarked.
carto_api_key: cb1_2eat_1_d96fa610782c1dc1795400fb

# Image library (_plugins/image_library.rb). Every image under a root gets a
# metadata record in _images/; `surfaces` is the default routing stamped onto
# NEW records from that root (editable per-image afterwards — the generator
# never overwrites a hand-edited field). Add roots here as more of assets/
# moves into the library.
image_library:
  roots:
    - path: assets/photos
      surfaces: [diary]
    # Trip-writeup folders, adopted in place (files never moved, so the
    # hardcoded paths in older notes keep working). No default surfaces —
    # these appear where a note embeds them, or wherever they're tagged.
    - path: assets/CDMX
    - path: assets/Cuixmala
    - path: assets/NewOrleans
    - path: assets/SanDiego2024
    - path: assets/como2023
    - path: assets/lisbon
    - path: assets/marthasvineyard
    - path: assets/paris2022
    - path: assets/southafrica2024

# Library image embeds (_plugins/image_embeds.rb): what clicking an embedded
# figure does. Options: none (not clickable — current choice), lightbox
# (overlay scoped to that post's images, with prev/next), page (the image's
# /photos/<slug>/ page). Flip to lightbox to try it; see COO-101 in Linear.
image_embeds:
  click: none

include:             ['_pages']
exclude:             ['_includes/notes_graph.json', '_dev']
# You may need to change the base URL depending on your deploy configuration.
baseurl:             ''

# If you are using a host that cannot resolve URLs that do
# not end with .html (such as Neocities), set this to 'true'.
use_html_extension:  false

# Set to `true` to open non-internal links in new tabs, or
# set to `false` to open non-internal links in current tab.
open_external_links_in_new_tab: true

# Set to `true` to replace tweet URLs with Twitter embeds.
# Note that doing so will negatively the reader's privacy
# as their browser will communicate with Twitter's servers.
embed_tweets: false

permalink:           pretty
relative_permalinks: false

plugins:
  - jekyll-last-modified-at

sass:
  sass_dir:          _sass
  style:            :compressed

collections:
  notes:
    output: true
    permalink: /:slug
  # The image library (_images/, maintained by _plugins/image_library.rb).
  # Successor to the old `photos` collection — the permalink keeps the
  # original /photos/<slug>/ URLs live.
  images:
    output: true
    permalink: /photos/:slug

defaults:
  - scope:
      path: "**/*"
    values:
      layout: "default"
  - scope:
      path: "_notes/**/*.md"
    values:
      layout: "note"
  - scope:
      path: "_images/**/*.md"
    values:
      layout: "photo"
  # Media notes (Books / Movies / Albums) use a richer frontmatter-driven
  # layout. Listed after the _notes rule so it takes precedence.
  - scope:
      path: "_notes/MediaDiet/**/*.md"
    values:
      layout: "media"
  # Cocktail database: cocktails and cabinet bottles get frontmatter-driven
  # layouts (with the cocktail<->cabinet pivot baked by cocktail_cabinet.rb).
  # Listed after the _notes rule so they take precedence.
  - scope:
      path: "_notes/FoodDrink/Cocktails/**/*.md"
    values:
      layout: "cocktail"
  - scope:
      path: "_notes/FoodDrink/Cabinet/**/*.md"
    values:
      layout: "cabinet"
  # Places notes (venues + destinations) likewise get a frontmatter-driven
  # layout (rating, visits, map link).
  - scope:
      path: "_notes/Places/**/*.md"
    values:
      layout: "place"
